[package]
name = "bitcoinvert"
version = "0.2.1"
description = "CLI tool that fetches Bitcoin exchange rates from Blockchain.info and shows conversions to other currencies/denominations"
authors = ["Gabriel Comte"]
edition = "2021"
rust-version = "1.95.0"
repository = "https://github.com/gcomte/bitcoinvert"
license = "MIT"


[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
exitcode = "1.1.2"
home-config = "0.7.0"
log = "0.4.34"
noyalib = { version = "0.0.58", default-features = false, features = ["std"] }
num-bigint = "0.5.1"
num-rational = { version = "0.4.2", default-features = false, features = ["std"] }
num-traits = "0.2.19"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
si-unit-prefix = "1.0.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
tabled = "0.22.0"
thiserror = "2.0.21"
thousands = "0.2.0"
typetag = "0.2.23"

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.12.0"
tempfile = "3.27.0"
